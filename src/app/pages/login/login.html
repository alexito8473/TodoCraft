<div class="login-page">
  <section class="login-card">
    <a class="brand" routerLink="/" aria-label="TodoCraft, inicio">
      <span class="brand-icon">T</span>
      <span>TodoCraft</span>
    </a>

    <div class="heading">
      <h1>¡Qué bueno verte!</h1>
      <p>Inicia sesión para continuar con tus proyectos.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="tu@ejemplo.com"
          [(ngModel)]="email"
          autocomplete="email"
          required
          email
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
        </div>

        <div class="password-wrapper">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Introduce tu contraseña"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />

          <button
            class="toggle-password"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <p class="error-message" role="alert">
          {{ errorMessage }}
        </p>
      }

      <button class="submit-button" type="submit" [disabled]="loading || loginForm.invalid">
        @if (loading) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
        @if (!loading) {
          <span aria-hidden="true">→</span>
        }
      </button>
    </form>

    <p class="signup-text">
      ¿Todavía no tienes una cuenta?
      <a routerLink="/register">Crear cuenta</a>
    </p>

    <p class="footer-text">Organiza tus tareas. Construye tus ideas.</p>
  </section>
</div>
